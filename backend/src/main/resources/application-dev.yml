spark-variables:
  cors:
    allowed-origin: http://localhost:5173
  csrf:
    enabled: false
  seed-database: true

springdoc:
  swagger-ui:
    with-credentials: true
    csrf:
      enabled: true

spring:
  docker:
    compose:
      file: docker-compose.yaml
      lifecycle-management: start_only
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: localhost
    port: 1025

  datasource:
    url: jdbc:postgresql://localhost:5432/spark-db
    username: spark-user
    password: password

  flyway:
    enabled: true
    validate-on-migrate: true
    validate-migration-naming: true

  jpa:
    show-sql: on

logging:
  level:
    root: INFO
    com.flare.spark: DEBUG