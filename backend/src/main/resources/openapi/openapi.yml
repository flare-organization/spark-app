openapi: 3.0.3
info:
  title: Package API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /api/v1/packages:
    get:
      summary: Get all packages
      operationId: getPackages
      responses:
        '200':
          description: List of packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'

components:
  schemas:
    Package:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        version:
          type: string
      required:
        - id
        - name