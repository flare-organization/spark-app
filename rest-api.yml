openapi: 3.0.3
info:
  title: Spark Bundle API
  version: 0.0.1

servers:
  - url: http://localhost:8080

paths:
  /api/v1/bundles:
    get:
      tags:
        - Bundles
      summary: Get a list of bundles
      operationId: getBundles
      parameters:
        - $ref: "#/components/parameters/GetBundleParams"
      responses:
        200:
          description: List of bundles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bundle'
    post:
      tags:
        - Bundles
      summary: Create a new bundle
      operationId: createBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundle'
      responses:
        200:
          description: Returns the generated Bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'

components:
  parameters:
    GetBundleParams:
      name: "params"
      in: query
      required: true
      explode: true
      schema:
        $ref: "#/components/schemas/GetBundleParams"

  schemas:
    SignUpCredentials:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$'
          minLength: 2
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginCredentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$'
          minLength: 2
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 128

    Bundle:
      type: object
      required:
        - id
        - name
        - slug
        - description
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    GetBundleParams:
      type: object
      properties:
        search:
          type: string
        page:
          type: integer
          default: 0

    SlicedPagination:
      type: object
      required:
        - pageNumber
        - pageSize
        - isFirst
        - isLast
        - isEmpty
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        isFirst:
          type: boolean
        isLast:
          type: boolean
        isEmpty:
          type: boolean

    PaginatedBundles:
      type: object
      required:
        - content
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Bundle'
      allOf:
        - $ref: '#/components/schemas/SlicedPagination'

    CreateBundle:
      type: object
      required:
        - name
        - description
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        status:
          type: string
          enum: [ PUBLIC, PRIVATE ]