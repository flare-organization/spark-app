openapi: 3.0.3
info:
  title: Spark Bundle API
  version: 0.0.1

servers:
  - url: http://localhost:8080

paths:
  /api/v1/login:
    post:
      tags:
        - Auth
      summary: Login with your credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/user'

  /api/v1/logout:
    post:
      tags:
        - Auth
      summary: Logout and destroy the current session
      operationId: logout
      responses:
        200:
          description: logout

  /api/v1/signup:
    post:
      tags:
        - Auth
      summary: Create a new account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        200:
          description: CurrentUser
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/user'

  /api/v1/me:
    post:
      tags:
        - Auth
      summary: Get the current user
      operationId: me
      responses:
        200:
          description: Something

  /api/v1/bundles:
    get:
      tags:
        - Bundles
      summary: Get a list of bundles
      operationId: getBundles
      parameters:
        - in: path
          name: page
          required: false
          schema:
            type: integer
            description: current page number
      responses:
        200:
          description: List of bundles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bundle'
    post:
      tags:
        - Bundles
      summary: Create a new bundle
      operationId: createBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundle'
      responses:
        200:
          description: Returns the generated Bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'

  /api/v1/bundles/search:
    get:
      tags:
        - Bundles
      summary: Get a filtered list of bundles
      operationId: searchBundles
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search term matched against bundle name
        - in: query
          name: page
          required: false
          schema:
            type: integer
            description: current page number
      responses:
        200:
          description: List of bundles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSearchBundles'

  /api/v1/send-email:
    post:
      tags:
        - Email
      summary: Send an email
      operationId: send-email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmail'
      responses:
        200:
          description: Empty response

components:
  schemas:
    SignUpRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$'
          minLength: 2
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$'
          minLength: 2
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 128

    Bundle:
      type: object
      required:
        - id
        - name
        - slug
        - description
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    user:
      type: object
      required:
        - username
      properties:
        username:
          type: string

    SlicedPagination:
      type: object
      required:
        - pageNumber
        - pageSize
        - isFirst
        - isLast
        - isEmpty
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        isFirst:
          type: boolean
        isLast:
          type: boolean
        isEmpty:
          type: boolean

    PaginatedBundles:
      type: object
      required:
        - content
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Bundle'
      allOf:
      - $ref: '#/components/schemas/SlicedPagination'

    CreateBundle:
      type: object
      required:
        - name
        - description
        - visibility
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 512
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]


    SearchBundle:
      type: object
      required:
        - name
        - description
        - visibility
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          type: string

    PaginatedSearchBundles:
      type: object
      required:
        - content
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SearchBundle'
      allOf:
        - $ref: '#/components/schemas/SlicedPagination'

    SendEmail:
      type: object
      required:
        - from
        - to
        - subject
        - body
      properties:
        from:
          type: string
          minLength: 1
          maxLength: 128
        to:
          type: string
          minLength: 1
          maxLength: 128
        subject:
          type: string
          minLength: 1
          maxLength: 128
        body:
          type: string